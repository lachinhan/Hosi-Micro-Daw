name: "Weekly Cloud Songbook & Preset Auto-Sync"

on:
  schedule:
    # Runs automatically every Monday at 00:00 UTC (7:00 AM VN time)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  sync-cloud-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout Public Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Run Cloud Data Sync & Validation"
        run: |
          python .github/scripts/sync_cloud_data.py

      - name: "Commit & Push Updated Cloud Datasets"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud/
          if git diff --staged --quiet; then
            echo "No changes detected in cloud datasets."
          else
            git commit -m "chore(cloud): auto-sync weekly trending songs & artist presets [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
