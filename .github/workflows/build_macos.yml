name: "Build macOS Universal Binary"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Configure CMake"
        run: |
          cmake -B build_mac \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"

      - name: "Build Standalone App and OBS Plugin"
        run: |
          cmake --build build_mac --config Release --target LiveStreamMicroDAW LiveStreamOBSReceiver -j 4

      - name: "Package macOS Release Bundle"
        run: |
          RELEASE_DIR="dist_macos/LiveStream Micro-DAW (macOS)"
          mkdir -p "${RELEASE_DIR}/Plugins"

          # 1. Copy Standalone App
          APP_PATH=$(find build_mac -name "LiveStream Micro-DAW.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -R "$APP_PATH" "${RELEASE_DIR}/"
            echo "✓ Copied App: $APP_PATH"
          fi

          # 2. Copy Plugins (VST3 & AU Component)
          VST3_PATH=$(find build_mac -name "LiveStream OBS Receiver.vst3" -type d | head -n 1)
          if [ -n "$VST3_PATH" ]; then
            cp -R "$VST3_PATH" "${RELEASE_DIR}/Plugins/"
            echo "✓ Copied VST3: $VST3_PATH"
          fi

          AU_PATH=$(find build_mac -name "LiveStream OBS Receiver.component" -type d | head -n 1)
          if [ -n "$AU_PATH" ]; then
            cp -R "$AU_PATH" "${RELEASE_DIR}/Plugins/"
            echo "✓ Copied AU: $AU_PATH"
          fi

          # 3. Copy Docs
          cp "README.md" "${RELEASE_DIR}/"
          cp "README_EN.md" "${RELEASE_DIR}/"
          cp "HUONG_DAN_SU_DUNG.txt" "${RELEASE_DIR}/"

          # 4. Create 1-click installer command for macOS users
          cat << 'EOF' > "${RELEASE_DIR}/Cai_Dat_Plugin_OBS_Mac.command"
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          echo "========================================================"
          echo " CÀI ĐẶT PLUGIN LIVESTREAM OBS RECEIVER CHO MACOS"
          echo "========================================================"
          mkdir -p ~/Library/Audio/Plug-Ins/VST3
          mkdir -p ~/Library/Audio/Plug-Ins/Components

          if [ -d "$DIR/Plugins/LiveStream OBS Receiver.vst3" ]; then
              cp -R "$DIR/Plugins/LiveStream OBS Receiver.vst3" ~/Library/Audio/Plug-Ins/VST3/
              echo "✓ Đã cài VST3 vào ~/Library/Audio/Plug-Ins/VST3"
          fi

          if [ -d "$DIR/Plugins/LiveStream OBS Receiver.component" ]; then
              cp -R "$DIR/Plugins/LiveStream OBS Receiver.component" ~/Library/Audio/Plug-Ins/Components/
              echo "✓ Đã cài AU vào ~/Library/Audio/Plug-Ins/Components"
          fi

          echo ""
          echo "=== HOÀN TẤT CÀI ĐẶT PLUGIN CHO OBS MAC ==="
          EOF
          chmod +x "${RELEASE_DIR}/Cai_Dat_Plugin_OBS_Mac.command"

          # 5. Compress to Zip
          cd dist_macos
          zip -r -y "LiveStream_Micro_DAW_macOS.zip" "LiveStream Micro-DAW (macOS)"
          cd ..

      - name: "Upload macOS Release Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: LiveStream_Micro_DAW_macOS
          path: dist_macos/LiveStream_Micro_DAW_macOS.zip
          retention-days: 30
