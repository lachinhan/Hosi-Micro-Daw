name: "Build macOS Universal Binary (Free & PRO)"

on:
  push:
    branches: [ main, master, source-main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Configure CMake"
        run: |
          cmake -B build_mac \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"

      - name: "Build Standalone Apps (Free & PRO) and OBS Plugins (VST3 & AU)"
        run: |
          cmake --build build_mac --config Release --target LiveStreamMicroDAW LiveStreamMicroDAW_PRO LiveStreamOBSReceiver_VST3 LiveStreamOBSReceiver_AU -j 4

      - name: "Package Free & PRO macOS Release Bundles"
        run: |
          # Common script template for OBS plugin installation
          INSTALL_SCRIPT='#!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          echo "========================================================"
          echo " CÀI ĐẶT PLUGIN LIVESTREAM OBS RECEIVER CHO MACOS"
          echo "========================================================"
          mkdir -p ~/Library/Audio/Plug-Ins/VST3
          mkdir -p ~/Library/Audio/Plug-Ins/Components

          if [ -d "$DIR/Plugins/LiveStream OBS Receiver.vst3" ]; then
              cp -R "$DIR/Plugins/LiveStream OBS Receiver.vst3" ~/Library/Audio/Plug-Ins/VST3/
              echo "✓ Đã cài VST3 vào ~/Library/Audio/Plug-Ins/VST3"
          fi

          if [ -d "$DIR/Plugins/LiveStream OBS Receiver.component" ]; then
              cp -R "$DIR/Plugins/LiveStream OBS Receiver.component" ~/Library/Audio/Plug-Ins/Components/
              echo "✓ Đã cài AU vào ~/Library/Audio/Plug-Ins/Components"
          fi

          echo ""
          echo "=== HOÀN TẤT CÀI ĐẶT PLUGIN CHO OBS MAC ==="
          echo "Bây giờ bạn có thể mở OBS Studio và thêm bộ lọc VST3/Audio Unit!"
          '

          echo "=== 1. PACKAGING PRO EDITION ==="
          PRO_DIR="dist_macos/LiveStream Micro-DAW PRO (macOS)"
          mkdir -p "${PRO_DIR}/Plugins"
          find build_mac -name "LiveStream Micro-DAW PRO.app" -type d -exec cp -R {} "${PRO_DIR}/" \;
          find build_mac -name "*.vst3" -type d -exec cp -R {} "${PRO_DIR}/Plugins/" \;
          find build_mac -name "*.component" -type d -exec cp -R {} "${PRO_DIR}/Plugins/" \;
          cp "README.md" "${PRO_DIR}/"
          cp "README_EN.md" "${PRO_DIR}/"
          cp "HUONG_DAN_SU_DUNG.txt" "${PRO_DIR}/"
          printf "%s\n" "$INSTALL_SCRIPT" > "${PRO_DIR}/Cai_Dat_Plugin_OBS_Mac.command"
          chmod +x "${PRO_DIR}/Cai_Dat_Plugin_OBS_Mac.command"

          echo "=== 2. PACKAGING FREE EDITION ==="
          FREE_DIR="dist_macos/LiveStream Micro-DAW (macOS)"
          mkdir -p "${FREE_DIR}/Plugins"
          find build_mac -name "LiveStream Micro-DAW.app" -type d -exec cp -R {} "${FREE_DIR}/" \;
          find build_mac -name "*.vst3" -type d -exec cp -R {} "${FREE_DIR}/Plugins/" \;
          find build_mac -name "*.component" -type d -exec cp -R {} "${FREE_DIR}/Plugins/" \;
          cp "README.md" "${FREE_DIR}/"
          cp "README_EN.md" "${FREE_DIR}/"
          cp "HUONG_DAN_SU_DUNG.txt" "${FREE_DIR}/"
          printf "%s\n" "$INSTALL_SCRIPT" > "${FREE_DIR}/Cai_Dat_Plugin_OBS_Mac.command"
          chmod +x "${FREE_DIR}/Cai_Dat_Plugin_OBS_Mac.command"

          echo "=== 3. COMPRESSING ZIP ARCHIVES ==="
          cd dist_macos
          zip -r -y "LiveStream_Micro_DAW_PRO_macOS.zip" "LiveStream Micro-DAW PRO (macOS)"
          zip -r -y "LiveStream_Micro_DAW_Free_macOS.zip" "LiveStream Micro-DAW (macOS)"
          cd ..

      - name: "Upload PRO Edition macOS Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: LiveStream_Micro_DAW_PRO_macOS
          path: dist_macos/LiveStream_Micro_DAW_PRO_macOS.zip
          retention-days: 30

      - name: "Upload Free Edition macOS Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: LiveStream_Micro_DAW_Free_macOS
          path: dist_macos/LiveStream_Micro_DAW_Free_macOS.zip
          retention-days: 30
